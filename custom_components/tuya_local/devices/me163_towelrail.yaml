name: Towel rail heating element
products:
  - id: uzjk0pzbchkz2kxc
    model: ME163
entities:
  - entity: climate
    translation_only_key: thermostat
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 5
          max: 70
      - id: 3
        name: current_temperature
        type: integer
      - id: 4
        name: preset_mode
        type: string
        optional: true
        mapping:
          - dps_val: manual
            value: manual
          - dps_val: auto
            value: program
          - dps_val: eco
            value: eco
          - dps_val: comfort
            value: comfort
          - dps_val: frost
            value: away
      - id: 11
        name: hvac_action
        type: string
        optional: true
        mapping:
          - dps_val: open
            value: heating
          - dps_val: close
            value: idle
      - id: 13
        name: temperature_unit
        type: string
        optional: true
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 14
        name: temperature_f
        type: integer
        optional: true
      - id: 15
        name: current_temperature_f
        type: integer
        optional: true
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        name: lock
        type: boolean
        optional: true
  - entity: switch
    name: Smart mode
    icon: "mdi:thermostat-auto"
    category: config
    dps:
      - id: 101
        name: switch
        type: boolean
        optional: true
  - entity: number
    name: Temperature step
    category: config
    dps:
      - id: 102
        name: value
        type: integer
        optional: true
        range:
          min: 1
          max: 10
  - entity: number
    translation_key: timer
    class: duration
    dps:
      - id: 103
        name: value
        type: integer
        optional: true
        unit: min
        range:
          min: 0
          max: 240
        mapping:
          - step: 10
  - entity: number
    name: Timer step
    category: config
    dps:
      - id: 104
        name: value
        type: integer
        optional: true
        range:
          min: 5
          max: 40
        mapping:
          - scale: 10
            step: 5
  - entity: switch
    name: Display after power off
    icon: "mdi:monitor"
    category: config
    dps:
      - id: 105
        name: switch
        type: boolean
        optional: true
